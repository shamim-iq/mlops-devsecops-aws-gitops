name: CI

on:
  pull_request:
  push:

jobs:
  app:
    name: Test, scan, and build
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Generate model artifact
        run: python scripts/train_model.py

      - name: Run tests
        run: pytest

      - name: Run linting
        run: ruff check app scripts tests topology

      - name: Run dependency audit
        run: pip-audit -r requirements-dev.txt

      - name: Build Docker image
        run: docker build -t mlops-prediction-api:ci .
