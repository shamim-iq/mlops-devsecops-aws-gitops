apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: prediction-api
  namespace: prediction-api
  labels:
    app.kubernetes.io/name: prediction-api
    app.kubernetes.io/part-of: mlops-devsecops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-api
  strategy:
    canary:
      stableService: prediction-api
      steps:
        - setWeight: 20
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: prediction-api-success-rate
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-api
        app.kubernetes.io/part-of: mlops-devsecops-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: prediction-api
          image: prediction-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
