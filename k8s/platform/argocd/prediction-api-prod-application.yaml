apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prediction-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shamim-iq/mlops-devsecops-aws-gitops.git
    targetRevision: main
    path: k8s/apps/prediction-api/chart
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prediction-api
